kind: tck
syntax: v1-alpha
id: digital-twin-registry-e2e
metadata:
  name: Digital Twin Registry — E2E test
  version: v0.1.0
  description: >
    Proves that a partner can find, negotiate and use Digital Twin Registry through the connector, and that something
    that is not offered is not found.
  authors:
    - name: Eclipse Tractus-X contributors
      company: Eclipse Tractus-X
  copyright_holders:
    - 2026 Contributors to the Eclipse Foundation
  license: Apache-2.0
  tags:
    - e2e
dataspace:
  ecosystem: Catena-X
  version: saturn
infrastructure:
  engine:
    connector:
      required: true
  sut:
    connector:
      required: true
env:
  variables:
    - id: product_internal_url
      uses: variable/type/string
      name: Product API, as its own connector reaches it
      description: >
        Address of your product's API as the data plane of the connector in front of it can reach it, e.g.
        https://digital-twin-registry.example.org. In the workflow it defaults to a small echo service, so the template
        passes before you have changed anything.
      with:
        source: input
        scope: sut
      returns:
        value:
          type: string
    - id: product_asset
      uses: config/connector/asset
      name: Your product, offered as an asset
      with:
        source: value
        value:
          asset_id: digital-twin-registry-e2e-asset
          base_url: ${{ env.product_internal_url }}
          dct_type: https://w3id.org/catenax/taxonomy#TestData
          version: "1.0"
      returns:
        value:
          type: object
          class: Asset
    - id: access_policy
      uses: config/connector/policy
      name: Who may see the offer
      with:
        source: value
        value:
          policy_id: digital-twin-registry-e2e-access-policy
          permissions:
            - action: access
              constraints:
                - left_operand: Membership
                  operator: eq
                  right_operand: active
      returns:
        value:
          type: object
          class: Policy
    - id: usage_policy
      uses: config/connector/policy
      name: What a partner may use the data for
      with:
        source: value
        value:
          policy_id: digital-twin-registry-e2e-usage-policy
          permissions:
            - action: use
              constraints:
                - and:
                    - left_operand: Membership
                      operator: eq
                      right_operand: active
                    - left_operand: FrameworkAgreement
                      operator: eq
                      right_operand: DataExchangeGovernance:1.0
                    - left_operand: UsagePurpose
                      operator: isAnyOf
                      right_operand:
                        - cx.core.industrycore:1
      returns:
        value:
          type: object
          class: Policy
tests:
  - id: partner_uses_my_product.yaml
    name: A partner finds the offer, negotiates a contract and gets an answer
  - id: unknown_offer_is_not_found.yaml
    name: An offer that was never published is not in the catalog
